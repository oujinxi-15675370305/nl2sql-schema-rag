<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NL2SQL · Schema RAG 智能问数</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong>NL2SQL Schema RAG</strong>
      <span class="sub">自然语言 → 检索 schema → 生成 SQL → 校验 → 执行</span>
    </div>
    <div class="right">
      <select id="role" class="role-select" title="角色（决定可见列）">
        <option value="analyst">分析师</option>
        <option value="viewer">只读访客</option>
      </select>
      <button id="btn-new" class="ghost">新会话</button>
      <button id="btn-demo" class="ghost" title="固定 SQL 演示：两条 SQL 写死，不调模型；只演示「写错列名 → 带报错改对」的时间线">演示修复</button>
      <button id="btn-eval" class="ghost" title="走离线规则基线（CI 用，约 2ms）；模型评测用 python -m app.evals --engine llm">跑评测</button>
      <a id="link-schema" class="ghost" href="/api/schema">看 schema</a>
    </div>
  </header>

  <main class="layout">
    <section class="panel input-panel">
      <label for="q">你的问题</label>
      <textarea id="q" rows="3" placeholder="例如：上个月各地区的 GMV 是多少？"></textarea>
      <div class="samples"></div>
      <button id="btn-run" class="primary">生成并执行</button>
      <p class="hint">主路径走大模型（配置 LLM_API_KEY，约 0.8s/条）；没 key 或请求失败时降级到规则 fallback（约 2ms）。每次结果都会标出这次是谁生成的。</p>

      <div class="panel-block">
        <h3>命中的 schema</h3>
        <div id="ctx-metrics" class="tag-row"><span class="muted">指标 —</span></div>
        <div id="ctx-tables" class="tag-row"><span class="muted">表 —</span></div>
        <div id="ctx-columns" class="tag-row wrap"><span class="muted">列 —</span></div>
      </div>
    </section>

    <section class="panel result-panel">
      <div class="result-head">
        <h3>结果</h3>
        <span id="meta" class="meta"></span>
      </div>
      <div id="state" class="state"></div>
      <div id="rewrite" class="rewrite"></div>
      <div id="answer" class="answer"></div>
      <div id="attempts" class="attempts"></div>
      <div id="table-wrap" class="table-wrap"></div>

      <div class="panel-block">
        <div class="sql-head">
          <h3>生成的 SQL</h3>
          <button id="btn-copy" class="ghost small">复制</button>
        </div>
        <pre id="sql" class="sql">—</pre>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
