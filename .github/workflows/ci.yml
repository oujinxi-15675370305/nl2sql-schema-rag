name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成演示库
        run: python scripts/seed_demo_db.py
      - name: 单测
        run: python -m unittest discover -s tests -v
      - name: 评测（单轮 ≥90% / 意图 ≥90% / 多轮 ≥90%）
        run: python -m app.evals --threshold 0.9 --min-intent 0.9 --min-multi 0.9 --json > eval/last.json
      - name: 保存评测结果（失败时也能直接看哪条挂了）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: eval/last.json
          if-no-files-found: ignore
