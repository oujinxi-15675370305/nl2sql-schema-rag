name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成演示库
        run: python scripts/seed_demo_db.py
      - name: 单测
        run: python -m unittest discover -s tests -v
      - name: 评测（低于 90% 失败）
        run: python -m app.evals --threshold 0.9
